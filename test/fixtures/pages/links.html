<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <title>Links and footnotes</title>
    </head>
    <body>
        <article>
            <h2>References</h2>
            <p>
                Read <a href="https://example.com/docs">the docs</a>, then
                <a href="http://example.org/some/path?query=1&amp;other=2"
                    >this <em>emphasised</em> page</a
                >.
            </p>
            <p>
                A very long address:
                <a
                    href="https://example.com/a/very/long/path/that/keeps/going/and/going/and/going/and/going/and/going/and/going/and/going/index.html"
                    >long link</a
                >.
            </p>
        </article>
    </body>
</html>
