<!doctype html>
<html lang="en">
    <head>
        <meta charset="UTF-8" />
        <style>
            @media (min-width: 650px) {
                body {
                    font-size: 50px;
                }
            }
            body {
                min-width: 150px;
                padding: 16px;
                font-family: sans-serif;
            }
            h3 {
                margin: 0 0 12px;
            }
            button {
                width: 100%;
                padding: 10px;
                margin-top: 10px;
                background: #2563eb;
                color: white;
                border: none;
                border-radius: 6px;
                font-size: 1.2em;
                cursor: pointer;
            }
            button:hover {
                background: #1d4ed8;
            }
            #compatible,
            #incompatible {
                display: none;
            }
            /* Spinner overlay for in-progress state */
            #overlay {
                display: none;
                position: fixed;
                inset: 0;
                background: rgba(255, 255, 255, 0.85);
                z-index: 9999;
                text-align: center;
                padding-top: 40px;
            }
            #overlay .spinner {
                width: 36px;
                height: 36px;
                border: 4px solid #ddd;
                border-top-color: #2563eb;
                border-radius: 50%;
                animation: spin 0.8s linear infinite;
                margin: 0 auto 12px;
            }
            @keyframes spin {
                to {
                    transform: rotate(360deg);
                }
            }
        </style>
    </head>
    <body>
        <h3>eBook Generator</h3>
        <div id="compatible">
            <button id="btn-epub">Download EPUB</button>
        </div>

        <div id="incompatible">
            <p>This page is not in a format compatible with EPUB generation.</p>
        </div>

        <div id="overlay">
            <div class="spinner"></div>
            <div>Converting…</div>
        </div>

        <script src="popup.ts"></script>
    </body>
</html>
